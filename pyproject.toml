[project]
name = "timesheets"
version = "0.1.0"
description = "FastAPI web app that generates Romanian Anexa 1 timesheets"
readme = "README.md"
keywords = [
    "anexa-1",
    "fastapi",
    "openpyxl",
    "pontaj",
    "timesheet",
]
license = "MIT"
maintainers = [
    { name = "Alexandru Fikl", email = "alexfikl@gmail.com" },
]
authors = [
    { name = "Alexandru Fikl", email = "alexfikl@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "fastapi>=0.110",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.29",
]

[dependency-groups]
dev = [
    "pyproject-fmt",
    "reuse",
    "ruff",
    "ty",
    "typos",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 88
# This is a date-only app: the local calendar date from date.today() is intended.
lint.ignore = [ "DTZ011" ]
lint.isort.known-first-party = [ "timesheet" ]

[tool.typos]
files.extend-exclude = [ "web/static/htmx.min.js" ]
default.extend-ignore-re = [ "(?Rm)^.*#\\s*spell:\\s*disable$" ]

